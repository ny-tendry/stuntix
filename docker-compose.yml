services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: stuntix_backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: stuntix_frontend

    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend