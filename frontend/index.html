<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="Stuntix — plateforme analytique pour le suivi et la prédiction des risques de stunting chez les enfants de 0 à 5 ans.">
  <title>Stuntix — Analyse du risque de stunting</title>
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="assets/css/index.css">
</head>
<body class="landing-page">
  <main class="landing-shell">
    <div class="landing-noise" aria-hidden="true"></div>
    <div class="landing-grid" aria-hidden="true"></div>
    <div class="landing-glow landing-glow-a" aria-hidden="true"></div>
    <div class="landing-glow landing-glow-b" aria-hidden="true"></div>

    <div class="orb orb-a" aria-hidden="true"><span></span></div>
    <div class="orb orb-b" aria-hidden="true"><span></span></div>
    <div class="orb orb-c" aria-hidden="true"><span></span></div>
    <div class="orb orb-d" aria-hidden="true"><span></span></div>

    <div class="glass-arc glass-arc-left" aria-hidden="true"></div>
    <div class="glass-arc glass-arc-right" aria-hidden="true"></div>

    <section class="hero" aria-label="Accueil Stuntix">
      <div class="hero-logo-wrap">
        <span class="logo-aura" aria-hidden="true"></span>
        <img class="hero-logo" src="assets/img/stuntix-logo.png" alt="Stuntix">
      </div>

      <p class="hero-description">
        Plateforme d’analyse mondiale pour visualiser, comprendre et prédire les risques de stunting chez les enfants de 0 à 5 ans.
      </p>

      <div class="hero-actions">
        <a class="primary-cta" href="carte.html">
          <span>Explorer la plateforme</span>
          <i data-lucide="arrow-right" aria-hidden="true"></i>
        </a>

        <a class="secondary-cta" href="prediction.html">
          <i data-lucide="brain-circuit" aria-hidden="true"></i>
          <span>Lancer une prédiction</span>
        </a>
      </div>
    </section>
  </main>

  <script src="assets/js/index.js"></script>
</body>
</html>
