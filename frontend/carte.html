<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Stuntix — Carte mondiale</title>
    <link rel="icon" href="assets/img/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="assets/css/styles.css?v=20260909-map3" />
  </head>
  <body class="map-page">
    <div class="page-loader" role="status" aria-live="polite" aria-label="Chargement de la page">
      <span class="micro-spinner page-loader-spinner" aria-hidden="true"></span>
    </div>
    <div class="app-shell map-stage">
      <div class="water-texture" aria-hidden="true"></div>
      <div class="map-vignette" aria-hidden="true"></div>

      <button
        class="mobile-toggle glass"
        type="button"
        aria-label="Ouvrir le menu"
        aria-expanded="false"
      >
        <i data-lucide="menu"></i>
      </button>
      <div class="sidebar-scrim"></div>

      <aside class="sidebar glass">
        <a class="sidebar-home" href="index.html" title="Accueil" aria-label="Retour à la page d’accueil">
          <img src="assets/img/favicon.png" alt="" aria-hidden="true" />
        </a>
        <nav class="nav" aria-label="Navigation principale">
          <a class="nav-link active" href="carte.html" title="Carte mondiale" aria-label="Carte mondiale" aria-current="page">
            <i data-lucide="earth"></i>
          </a>
          <a class="nav-link" href="fiche-pays.html" title="Fiche pays" aria-label="Fiche pays">
            <i data-lucide="map-pinned"></i>
          </a>
          <a class="nav-link" href="profils-pays.html" title="Profils pays" aria-label="Profils pays">
            <i data-lucide="chart-no-axes-column-increasing"></i>
          </a>
          <a class="nav-link" href="prediction.html" title="Prédiction" aria-label="Prédiction">
            <i data-lucide="brain-circuit"></i>
          </a>
          <a class="nav-link" href="documentation.html" title="Documentation" aria-label="Documentation">
            <i data-lucide="book-open"></i>
          </a>
        </nav>
      </aside>

      <div
        id="worldMap"
        aria-label="Carte mondiale des niveaux de risque"
      ></div>

      <div
        id="mapLoading"
        class="map-loading glass"
        role="status"
        aria-live="polite"
      >
        <span class="micro-spinner" aria-hidden="true"></span>
        <span>Chargement de la carte</span>
      </div>

      <div class="search-wrap">
        <div class="search-box glass">
          <i data-lucide="search"></i>
          <input
            id="countrySearch"
            type="search"
            placeholder="Rechercher un pays..."
            aria-label="Rechercher un pays"
            autocomplete="off"
          />
        </div>
        <div
          id="searchSuggestions"
          class="search-suggestions glass"
          role="listbox"
          aria-label="Suggestions de pays"
        ></div>
      </div>

      <div class="map-legend glass" aria-label="Filtrer les niveaux de risque">
        <button
          class="legend-item active"
          type="button"
          data-cluster-filter="2"
          aria-pressed="true"
        >
          <span
            class="legend-dot"
            style="background: #67b66d; color: #67b66d"
          ></span
          >Faible
        </button>
        <button
          class="legend-item active"
          type="button"
          data-cluster-filter="1"
          aria-pressed="true"
        >
          <span
            class="legend-dot"
            style="background: #f2ad2d; color: #f2ad2d"
          ></span
          >Modéré
        </button>
        <button
          class="legend-item active"
          type="button"
          data-cluster-filter="0"
          aria-pressed="true"
        >
          <span
            class="legend-dot"
            style="background: #ef4f43; color: #ef4f43"
          ></span
          >Élevé
        </button>
      </div>

      <div class="map-tools">
        <button
          id="resetMap"
          class="tool-btn glass"
          type="button"
          title="Recentrer"
          aria-label="Recentrer la carte"
        >
          <i data-lucide="locate-fixed"></i>
        </button>
        <div class="zoom-stack glass">
          <button
            id="zoomIn"
            class="tool-btn"
            type="button"
            title="Zoom avant"
            aria-label="Zoom avant"
          >
            <i data-lucide="plus"></i>
          </button>
          <button
            id="zoomOut"
            class="tool-btn"
            type="button"
            title="Zoom arrière"
            aria-label="Zoom arrière"
          >
            <i data-lucide="minus"></i>
          </button>
        </div>
      </div>

      <div id="countryCard" class="map-country-card glass" aria-live="polite">
        <div class="country-card-top">
          <div id="countryCardName" class="country-name">Pays</div>
          <div class="country-card-actions">
            <span id="countryCardCluster" class="cluster-pill">Risque</span>
            <button
              id="closeCountryCard"
              class="country-card-close"
              type="button"
              aria-label="Fermer"
            >
              <i data-lucide="x"></i>
            </button>
          </div>
        </div>
        <div id="countryCardMeta" class="country-meta">
          Classification du risque de stunting.
        </div>
        <a
          id="countryProfileLink"
          class="country-action"
          href="fiche-pays.html"
          >Voir la fiche pays</a
        >
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts-maps@1.1.0/world.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/shared.js"></script>
    <script src="assets/js/map.js?v=20260909-map3"></script>
  </body>
</html>
